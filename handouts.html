<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Handouts | R&R Loss Control</title><link rel="stylesheet" href="handouts.css"><script defer src="vendor/jspdf.umd.min.js"></script><script defer src="field-tools.js"></script><script defer src="content-review.js"></script><script defer src="handouts.js"></script><script defer src="handouts-ui.js"></script><link rel="stylesheet" href="site-shell.css"><script defer src="site-shell.js"></script></head><body class="lc-shell">
<header><img src="rr-logo.png" alt="R&R Insurance"><a href="index.html#walk">Back to Walkthrough</a></header><main><p class="eyebrow">R&R INSURANCE, LOSS CONTROL</p><h1>Client handouts</h1><p>Pick a hazard sheet, a few for a packet, or a blank form.</p><p class="draft-note">DRAFT. R&R wording review is needed before these go to a client.</p>
<div class="fields"><label>Client name (optional)<input id="client" maxlength="120" autocomplete="organization"></label><label>Rep<input id="rep" maxlength="80" autocomplete="name"></label><label>Phone<input id="phone" type="tel" maxlength="40" autocomplete="tel"></label><label>Date<input id="date" type="date" required></label></div>
<div class="actions mode"><button id="show-hazards" type="button" aria-pressed="true">Hazard sheets</button><button id="show-forms" type="button" aria-pressed="false">Blank forms</button></div>
<section id="hazard-picker"><div class="fields"><label>Category<select id="category"><option value="">All seven categories</option></select></label><label>Search titles<input id="search" type="search" placeholder="Try ladder or lifting"></label></div><p id="result-count" role="status"></p><div id="hazard-list" class="handout-list"></div></section>
<section id="form-picker" hidden><h2>Blank forms</h2><div id="form-list" class="handout-list"></div></section>
<section class="sample output" aria-label="Selected handouts"><h2>Your handout</h2><p id="selection">Pick at least one sheet.</p><div id="chosen"></div><div class="actions"><button id="clear" type="button">Clear picks</button><button id="create" type="button" disabled>Create PDF</button><a id="download" class="download" hidden>Save PDF</a><a id="preview" class="download" target="_blank" rel="noopener" hidden>View PDF</a></div><p id="message" role="status" aria-live="polite">Loading hazard sheets...</p></section>
</main></body></html>
